name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in development artifacts
        required: true
        default: 0.2.1-dev

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          check-latest: true
          cache: true
      - name: Select version
        id: version
        env:
          TAG_VERSION: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "value=${INPUT_VERSION:-$TAG_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Verify source
        run: make check
      - name: Build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.value }}
          COMMIT: ${{ github.sha }}
        run: make dist
      - name: Verify artifacts
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Upload development artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: net-link-${{ steps.version.outputs.value }}
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
